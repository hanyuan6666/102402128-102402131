<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发布信息 - 校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="publish">

  <div class="topbar">
    <button class="back-btn" onclick="history.back()">←</button>
    <span class="title">发布信息</span>
  </div>

  <form class="form-page" id="publishForm">

    <div class="form-group">
      <label>信息类型 <span class="req">*</span></label>
      <div class="type-selector">
        <div class="type-option found" data-type="found">🎁 我捡到了（招领）</div>
        <div class="type-option lost" data-type="lost">😭 我丢了（寻物）</div>
      </div>
    </div>

    <div class="form-group">
      <label>物品名称 <span class="req">*</span></label>
      <input type="text" id="title" placeholder="如：校园卡（尾号3847）" required>
    </div>

    <div class="form-group">
      <label>物品类别</label>
      <select id="category">
        <option value="证件">证件（校园卡、身份证等）</option>
        <option value="电子产品">电子产品（手机、耳机等）</option>
        <option value="钥匙">钥匙</option>
        <option value="书籍">书籍</option>
        <option value="生活用品">生活用品（伞、水杯等）</option>
        <option value="其他">其他</option>
      </select>
    </div>

    <div class="form-group">
      <label>遗失/拾取地点</label>
      <input type="text" id="location" placeholder="如：图书馆二楼自习室">
    </div>

    <div class="form-group">
      <label>详细描述</label>
      <textarea id="description" placeholder="补充物品特征、颜色、品牌等信息，帮助更快认领..."></textarea>
    </div>

    <div class="form-group">
      <label>发布人称呼</label>
      <input type="text" id="author" placeholder="如：热心同学（选填）">
    </div>

    <div class="form-group">
      <label>联系方式 <span class="req">*</span></label>
      <input type="text" id="contact" placeholder="如：QQ/微信/手机号" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">发布</button>
  </form>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
