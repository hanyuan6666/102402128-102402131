<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <!-- 搜索栏 -->
  <div class="search-bar">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="搜索物品名称...">
  </div>

  <!-- Tab 切换 -->
  <div class="tabs">
    <button class="tab active" data-type="all">全部</button>
    <button class="tab" data-type="lost">寻物启事</button>
    <button class="tab" data-type="found">失物招领</button>
  </div>

  <!-- 分类筛选 -->
  <div class="chip-row">
    <button class="chip active" data-category="all">全部类别</button>
    <button class="chip" data-category="证件">证件</button>
    <button class="chip" data-category="电子产品">电子产品</button>
    <button class="chip" data-category="钥匙">钥匙</button>
    <button class="chip" data-category="书籍">书籍</button>
    <button class="chip" data-category="生活用品">生活用品</button>
    <button class="chip" data-category="其他">其他</button>
  </div>

  <!-- 物品列表 -->
  <div class="item-list" id="itemList"></div>

  <!-- 悬浮发布按钮 -->
  <a class="fab" href="publish.html">+</a>

  <!-- 底部导航 -->
  <nav class="bottom-nav">
    <a class="nav-item active" href="index.html">
      <span class="nav-icon">🏠</span>首页
    </a>
    <a class="nav-item" href="publish.html">
      <span class="nav-icon">📝</span>发布
    </a>
    <a class="nav-item" href="my.html">
      <span class="nav-icon">👤</span>我的发布
    </a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
